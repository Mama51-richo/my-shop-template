<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streetwear Shop</title>
    <!-- Load Telegram Web App API -->
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #222222);
            padding: 20px; 
            margin: 0;
        }
        .card { 
            border: 1px solid var(--tg-theme-hint-color, #ccc); 
            border-radius: 12px; 
            padding: 20px; 
            max-width: 260px; 
            margin: 30px auto; 
            background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
        }
        .item-img {
            width: 100%;
            border-radius: 8px;
            background-color: #eee;
        }
        .price { 
            font-size: 20px; 
            color: #2ec4b6; 
            font-weight: bold; 
            margin: 15px 0;
        }
        .btn { 
            background-color: var(--tg-theme-button-color, #2481cc); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h2>Clothing Shop</h2>
    
    <div class="card">
        <!-- Live placeholder image for item layout -->
        <img class="item-img" src="https://picsum.photos" alt="Hoodie">
        <h3>Streetwear Hoodie</h3>
        <p class="price">1,500 ETB</p>
        <button class="btn" onclick="confirmOrder()">Order Now</button>
    </div>

    <script>
        // Initialize Telegram interface
        const tg = window.Telegram.WebApp;
        tg.expand(); // Make it open full screen

        // Native popup handler
        function confirmOrder() {
            tg.showConfirm("Are you sure you want to order this Streetwear Hoodie for 1,500 ETB?", function(approved) {
                if (approved) {
                    tg.showAlert("Order placement registered! Next, we will connect your backend token logic.");
                }
            });
        }
    </script>
</body>
</html>
