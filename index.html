<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streetwear Shop</title>
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background-color: #ffffff; 
            color: #222222;
            padding: 20px; 
            margin: 0;
        }
        .catalog-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin: 20px auto;
        }
        .card { 
            border: 1px solid #ccc; 
            border-radius: 12px; 
            padding: 15px; 
            width: 240px; 
            background-color: #f9f9f9;
        }
        .item-img {
            width: 100%;
            border-radius: 8px;
        }
        .price { 
            font-size: 18px; 
            color: #2ec4b6; 
            font-weight: bold; 
            margin: 10px 0;
        }
        .btn { 
            background-color: #2481cc; 
            color: #ffffff; 
            border: none; 
            padding: 10px; 
            width: 100%; 
            border-radius: 6px; 
            font-size: 14px;
            font-weight: bold;
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h2>Clothing Catalog</h2>
    
    <div id="catalog" class="catalog-container">
        <!-- Products will safely display here -->
    </div>

    <script>
        // Force the app environment to initialize
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Run rendering only after the page is fully ready
        window.addEventListener('DOMContentLoaded', () => {
            const products = [
                { name: "Streetwear Hoodie", price: "1,500 ETB", img: "https://picsum.photos" },
                { name: "Classic Cargo Pants", price: "1,800 ETB", img: "https://picsum.photos" },
                { name: "Oversized Vintage Tee", price: "950 ETB", img: "https://picsum.photos" }
            ];

            const catalogDiv = document.getElementById("catalog");
            
            let htmlContent = "";
            products.forEach(item => {
                htmlContent += `
                    <div class="card">
                        <img class="item-img" src="${item.img}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <p class="price">${item.price}</p>
                        <button class="btn" onclick="confirmOrder('${item.name}', '${item.price}')">Order Now</button>
                    </div>
                `;
            });
            
            catalogDiv.innerHTML = htmlContent;
        });

        function confirmOrder(itemName, itemPrice) {
            tg.showConfirm(`Are you sure you want to order the ${itemName} for ${itemPrice}?`, function(approved) {
                if (approved) {
                    tg.showAlert(`Order for ${itemName} registered!`);
                }
            });
        }
    </script>
</body>
</html>
